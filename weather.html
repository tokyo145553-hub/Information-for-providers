<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>気象警報</title>
<style>
:root {
  --bg-color:#0b0f16; --card-bg:#0f1720; --text-color:#e6eef8; --button-bg:#003b80; --button-hover:#005acc;
  --button-success-bg:#28a745; --button-success-hover:#218838; --button-secondary-bg:#e9ecef;
  --button-secondary-text:#495057; --button-secondary-hover:#dee2e6; --border-color:#333;
  --select-bg:#0f1720; --select-text:#e6eef8; --update-time-color:#a0a8b8; --shadow:0 2px 5px rgba(0,0,0,0.3);
}
:root[data-theme="light"] {
  --bg-color:#f5f5f5; --card-bg:#ffffff; --text-color:#333; --button-bg:#0066cc; --button-hover:#0055aa;
  --border-color:#ccc; --select-bg:#ffffff; --select-text:#333; --update-time-color:#666; --shadow:0 2px 5px rgba(0,0,0,0.1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg-color:#f5f5f5; --card-bg:#ffffff; --text-color:#333; --button-bg:#0066cc; --button-hover:#0055aa;
    --border-color:#ccc; --select-bg:#ffffff; --select-text:#333; --update-time-color:#666; --shadow:0 2px 5px rgba(0,0,0,0.1);
  }
}
* { transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease; }
body { font-family:sans-serif; max-width:900px; margin:40px auto; padding:20px; background:var(--bg-color); color:var(--text-color); }
.btn { padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; transition:background 0.2s; display:inline-flex; align-items:center; gap:8px; }
#copyBtn { background:var(--button-success-bg); color:white; width:100%; justify-content:center; font-size:16px; margin-bottom:15px; }
#copyBtn:hover { background:var(--button-success-hover); }
.nav-buttons { display:flex; gap:10px; margin-bottom:15px; }
.btn-secondary { background:var(--button-secondary-bg); color:var(--button-secondary-text); flex:1; justify-content:center; transition:background 0.2s; }
.btn-secondary:hover { background:var(--button-secondary-hover); }
#areaSelect { display:block; width:80%; margin:0 auto 15px auto; padding:10px; font-size:16px; border-radius:5px; background:var(--select-bg); color:var(--select-text); border:1px solid var(--border-color); }
.radio-group { display:flex; justify-content:center; gap:15px; margin-top:10px; }
.radio-group label { color:var(--text-color); }
#eew { background:var(--card-bg); border:1px solid var(--border-color); border-radius:10px; padding:20px; line-height:1.6; box-shadow:var(--shadow); white-space:pre-wrap; word-break:break-all; color:var(--text-color); }
#updateTime { color:var(--update-time-color); text-align:center; margin-bottom:10px; font-size:14px; }
#xmlStatus { color:var(--update-time-color); text-align:center; margin-bottom:10px; font-size:12px; }
</style>
</head>
<body>

  <div class="nav-buttons">

<script>
const JMA_BASE = "https://www.jma.go.jp/bosai";
const AREA_JSON_URL = `${JMA_BASE}/common/const/area.json`;
const WARNING_R8_BASE_URL = `${JMA_BASE}/warning/data/r8`;

const regionCodeByName = {
  "宗谷地方":"011000","上川・留萌地方":"012000","網走・北見・紋別地方":"013000","十勝地方":"014030","釧路・根室地方":"014100",
  "胆振・日高地方":"015000","石狩・空知・後志地方":"016000","渡島・檜山地方":"017000",
  "青森県":"020000","岩手県":"030000","宮城県":"040000","秋田県":"050000","山形県":"060000","福島県":"070000",
  "茨城県":"080000","栃木県":"090000","群馬県":"100000","埼玉県":"110000","千葉県":"120000","東京都":"130000","神奈川県":"140000",
  "新潟県":"150000","富山県":"160000","石川県":"170000","福井県":"180000","山梨県":"190000","長野県":"200000",
  "岐阜県":"210000","静岡県":"220000","愛知県":"230000","三重県":"240000",
  "滋賀県":"250000","京都府":"260000","大阪府":"270000","兵庫県":"280000","奈良県":"290000","和歌山県":"300000",
  "鳥取県":"310000","島根県":"320000","岡山県":"330000","広島県":"340000","山口県":"350000",
  "徳島県":"360000","香川県":"370000","愛媛県":"380000","高知県":"390000",
  "福岡県":"400000","佐賀県":"410000","長崎県":"420000","熊本県":"430000","大分県":"440000","宮崎県":"450000",
  "奄美地方（鹿児島県）":"460040","鹿児島県（奄美地方を除く）":"460100",
  "沖縄本島地方":"471000","大東島地方":"472000","宮古島地方":"473000","八重山地方":"474000"
};

let areaDataCache = null;
let latestUpdateId = 0;

function setNowTime() {
  const now = new Date();
  const p = n => String(n).padStart(2, '0');
  document.getElementById("updateTime").textContent =
    `取得日時: ${now.getFullYear()}/${p(now.getMonth() + 1)}/${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
}
setNowTime();

async function main(mode=2,taisho_chiiki="全国",statusFormat=false) {
  const updateId = ++latestUpdateId;
  try {
  const warnArea = {
  "00":{name:"解除",level:null},
  "02":{name:"暴風雪警報",level:3},
  "03":{name:"レベル3大雨警報",level:3},
  "04":{name:"洪水警報",level:3},
  "05":{name:"暴風警報",level:3},
  "06":{name:"大雪警報",level:3},
  "07":{name:"波浪警報",level:3},
  "08":{name:"レベル3高潮警報",level:3},
  "09":{name:"レベル3土砂災害警報",level:3},
  "10":{name:"レベル2大雨注意報",level:2},
  "12":{name:"大雪注意報",level:2},
  "13":{name:"風雪注意報",level:2},
  "14":{name:"雷注意報",level:2},
  "15":{name:"強風注意報",level:2},
  "16":{name:"波浪注意報",level:2},
  "17":{name:"融雪注意報",level:2},
  "18":{name:"洪水注意報",level:2},
  "19":{name:"レベル2高潮注意報",level:2},
  "20":{name:"濃霧注意報",level:2},
  "21":{name:"乾燥注意報",level:2},
  "22":{name:"なだれ注意報",level:2},
  "23":{name:"低温注意報",level:2},
  "24":{name:"霜注意報",level:2},
  "25":{name:"着氷注意報",level:2},
  "26":{name:"着雪注意報",level:2},
  "27":{name:"その他の注意報",level:2},
  "29":{name:"レベル2土砂災害注意報",level:2},
  "32":{name:"暴風雪特別警報",level:5},
  "33":{name:"レベル5大雨特別警報",level:5},
  "35":{name:"暴風特別警報",level:5},
  "36":{name:"大雪特別警報",level:5},
  "37":{name:"波浪特別警報",level:5},
  "38":{name:"レベル5高潮特別警報",level:5},
  "39":{name:"レベル5土砂災害特別警報",level:5},
  "42":{name:"未定・予約",level:null},
  "43":{name:"レベル4大雨危険警報",level:4},
  "45":{name:"未定・予約",level:null},
  "46":{name:"未定・予約",level:null},
  "47":{name:"未定・予約",level:null},
  "48":{name:"レベル4高潮危険警報",level:4},
  "49":{name:"レベル4土砂災害危険警報",level:4}
};

    document.getElementById("eew").textContent = "読み込み中...";

    const {warnData,regionReportDT} = await getCityWarningsByArea(warnArea,taisho_chiiki);
    if (updateId !== latestUpdateId) return;
    const data = warnData;

    const dt = new Date(regionReportDT || data.reportDatetime || Date.now());
    const MM = String(dt.getMonth() + 1).padStart(2, '0');
    const dd = String(dt.getDate()).padStart(2, '0');
    const HH = String(dt.getHours()).padStart(2, '0');
    const mm = String(dt.getMinutes()).padStart(2, '0');

    let titleKind = "";
    if (mode===2) titleKind = "気象警報・注意報";
    else if (mode===3) titleKind = "気象警報";
    else if (mode===4) titleKind = "気象危険/特別警報";
    let titleArea1 = "";  let titleArea2 = "";
    if (taisho_chiiki==="全国") titleArea1 = "全国の";
    else titleArea2 = "\n"+taisho_chiiki;

    let text = "";
    if (statusFormat) {
      text = `《${titleKind}》${titleArea2}\n${dd}日${HH}時${mm}分 ${data.publishingOffice || "気象庁"}発表`;
    } else {
      text = `《${titleArea1}${titleKind}》${titleArea2}\n${MM}月${dd}日${HH}時${mm}分`;
      if (regionReportDT) text += " 発表";
      else text += " 更新";
    }
    let count = 0;

    const warnOrder = ["レベル5大雨特別警報","レベル5土砂災害特別警報","レベル5高潮特別警報",
      "暴風特別警報","大雪特別警報","暴風雪特別警報","波浪特別警報",
      "レベル4大雨危険警報","レベル4土砂災害危険警報","レベル4高潮危険警報",
      "レベル3大雨警報","レベル3土砂災害警報","レベル3高潮警報",
      "暴風警報","大雪警報","暴風雪警報","波浪警報",
      "レベル2大雨注意報","レベル2土砂災害注意報","レベル2高潮注意報",
      "強風注意報","大雪注意報","風雪注意報","雷注意報","波浪注意報","濃霧注意報","乾燥注意報",
      "融雪注意報","なだれ注意報","低温注意報","霜注意報","着氷注意報","着雪注意報","その他の注意報"
    ];

    const sortedWarnNames = [
      ...warnOrder.filter(name => data.warnInfo[name]),
      ...Object.keys(data.warnInfo).filter(name => !warnOrder.includes(name))
    ];

    for (const warnName of sortedWarnNames) {
      const areas = data.warnInfo[warnName];
      if (Object.keys(areas).length === 0) continue;

      const info = Object.values(warnArea).find(w => w.name === warnName);
      if (!info || info.level < mode) continue;

      let block = "";
      let hasArea = false;

      for (const areaName in areas) {
        if (taisho_chiiki !== "全国" && areaName !== taisho_chiiki) continue;

        const cities = areas[areaName];
        if (!cities || cities.length === 0) continue;

        if (!hasArea) {
          const coloredName = `${getWarnColor(info.level)}${warnName}${getWarnColor(info.level)}`;
          block += `\n\n${coloredName}`;
          hasArea = true;
          count++;
        }

        if (statusFormat) {
          const statusGroups = data.statusInfo?.[warnName]?.[areaName] || {};
          const orderedStatus = ["発表","特別警報から危険警報","特別警報から警報","危険警報から警報","継続","特別警報から注意報","危険警報から注意報","警報から注意報","解除"];
          for (const status of orderedStatus) {
            const list = statusGroups[status];
            if (!list || list.length === 0) continue;
            block += `\n【${status}】`;
            block += list.join("　");
          }
        } else {
          block += `\n【${areaName}】\n`;
          block += cities.join("　");
        }
      }

      text += block;
    }

    if (count===0) {
      if (mode===2) text += "\n\n発表中の気象警報・注意報等はありません。";
      else if (mode===3) text += "\n\n発表中の気象警報はありません。";
      else if (mode===4) text += "\n\n発表中の危険警報・特別警報はありません。";
    }

    document.getElementById("eew").textContent = text.trim();
  } catch(e) {
    if (updateId !== latestUpdateId) return;
    document.getElementById("eew").textContent = "ERROR\n" + (e.message || e);
  }
}

async function getCityWarningsByArea(warnArea,taisho_chiiki="全国") {
  const areaData = await getAreaData();
  const targetCodes = getTargetRegionCodes(taisho_chiiki);
  if (targetCodes.length === 0) throw new Error(`未対応の地域です: ${taisho_chiiki}`);

  const warnByTypeAndArea = createWarnInfoTemplate(warnArea);
  const statusInfo = createWarnInfoTemplate(warnArea);
  let reportDatetime = "";
  let regionReportDT = "";
  let publishingOffice = "";

  const dataJson = await fetchR8WarningData(targetCodes);

  for (const item of dataJson) {
    if (!item || !item.warning) continue;
    if (reportDatetime==="") {
      reportDatetime = item.reportDatetime;
      publishingOffice = item.publishingOffice || "";
    } else if (item.reportDatetime > reportDatetime) {
      reportDatetime = item.reportDatetime;
      publishingOffice = item.publishingOffice || publishingOffice;
    }

    const largeAreaCode = item.regionCode;
    const largeAreaName = getRegionName(largeAreaCode);

    if (largeAreaName && taisho_chiiki===largeAreaName) {
      if (!regionReportDT || item.reportDatetime > regionReportDT) regionReportDT = item.reportDatetime || "NaN";
    }

    for (const area of item.warning.class20Items || []) {
      const cityInfo = areaData.class20s?.[area.areaCode];
      if (!cityInfo) continue;
      const cityName = cityInfo.name;

      for (const w of area.kinds || []) {
        if (!w.code || w.status === "解除") continue;

        const info = warnArea[w.code];
        if (!info) continue;

        const warnName = info.name;
        if (!warnName || !warnByTypeAndArea[warnName]) continue;

        if (!warnByTypeAndArea[warnName][largeAreaName]) warnByTypeAndArea[warnName][largeAreaName] = [];
        if (!warnByTypeAndArea[warnName][largeAreaName].includes(cityName)) warnByTypeAndArea[warnName][largeAreaName].push(cityName);

        const status = w.status || "発表";
        if (!statusInfo[warnName][largeAreaName]) statusInfo[warnName][largeAreaName] = {};
        if (!statusInfo[warnName][largeAreaName][status]) statusInfo[warnName][largeAreaName][status] = [];
        if (!statusInfo[warnName][largeAreaName][status].includes(cityName)) statusInfo[warnName][largeAreaName][status].push(cityName);
      }
    }
  }

  const warnData = { "reportDatetime": reportDatetime, "publishingOffice": publishingOffice, "warnInfo": warnByTypeAndArea, "statusInfo": statusInfo };
  return {warnData,regionReportDT};
}

function createWarnInfoTemplate(warnArea) {
  const warnByTypeAndArea = {};
  for (const info of Object.values(warnArea)) {
    if (!info.name || info.name === "解除" || info.name === "未定・予約") continue;
    warnByTypeAndArea[info.name] = {};
  }
  return warnByTypeAndArea;
}

async function getAreaData() {
  if (!areaDataCache) {
    const res = await fetch(AREA_JSON_URL, {cache:"no-store"});
    if (!res.ok) throw new Error(`地域定義JSONの取得に失敗しました: ${res.status}`);
    areaDataCache = await res.json();
  }
  return areaDataCache;
}

function getTargetRegionCodes(taisho_chiiki) {
  if (taisho_chiiki === "全国") return Object.values(regionCodeByName);
  const code = regionCodeByName[taisho_chiiki];
  return code ? [code] : [];
}

function getRegionName(regionCode) {
  for (const name in regionCodeByName) {
    if (regionCodeByName[name] === regionCode) return name;
  }
  return regionCode;
}

// ================================================================
// 気象庁防災情報XML(随時フィード extra.xml)の解析
//
// 更新のたびに、bosai の R8 JSON と XMLフィードを同時に取得する。
// XML(警報・注意報 VPWW55〜60)の方がJSONより新しい場合だけ、
// 市町村×現象ごとにJSONのレポートをXMLの内容で上書き(オーバーレイ)してから
// 本文生成に渡す。JSONが追いついたら、そのオーバーレイは自動的に破棄される。
// 対象外の現象(洪水・雷・その他注意報など)は従来どおりJSONの内容。
// ================================================================
const XML_FEED_URL = "https://www.data.jma.go.jp/developer/xml/feed/extra.xml";
const XML_DOC_URL_RE = /_VPWW(55|56|57|58|59|60)_(\d{6})\.xml$/i;
const XML_MUNICIPALITY_WARNING_TYPE = "気象警報・注意報（市町村等）";
const XML_FETCH_PARALLEL = 6;                 // 電文の同時取得数
const XML_OVERLAY_TTL_MS = 30 * 60 * 1000;    // 万一JSONが追いつかない場合の保険

// 電文種別 → その電文が扱う現象(Kindから特定できないときの既定)
const XML_DOC_COVERS = {
  "55": ["大雨"], "56": ["土砂災害"], "57": ["高潮"],
  "58": ["暴風", "暴風雪"], "59": ["波浪"], "60": ["大雪"]
};
// 現象 → レベル別の警報コード(2=注意報 3=警報 4=危険警報 5=特別警報)
const PHENOMENON_CODES = {
  "大雨":     { 2: "10", 3: "03", 4: "43", 5: "33" },
  "土砂災害": { 2: "29", 3: "09", 4: "49", 5: "39" },
  "高潮":     { 2: "19", 3: "08", 4: "48", 5: "38" },
  "暴風":     { 2: "15", 3: "05", 5: "35" },
  "暴風雪":   { 2: "13", 3: "02", 5: "32" },
  "波浪":     { 2: "16", 3: "07", 5: "37" },
  "大雪":     { 2: "12", 3: "06", 5: "36" },
  "洪水":     { 2: "18", 3: "04" }
};
const PHEN_OF_CODE = {};
for (const [phen, byLevel] of Object.entries(PHENOMENON_CODES)) {
  for (const c of Object.values(byLevel)) PHEN_OF_CODE[c] = phen;
}

// Kind名(「大雨危険警報」「暴風雪特別警報」など)から警報コードを求める
function xmlNameToCode(name) {
  if (!name) return null;
  let phen = null;
  if (name.includes("風雪")) phen = "暴風雪";
  else if (name.includes("暴風") || name.includes("強風")) phen = "暴風";
  else if (name.includes("土砂")) phen = "土砂災害";
  else if (name.includes("大雨")) phen = "大雨";
  else if (name.includes("高潮")) phen = "高潮";
  else if (name.includes("波浪")) phen = "波浪";
  else if (name.includes("大雪")) phen = "大雪";
  else if (name.includes("洪水")) phen = "洪水";
  if (!phen) return null;
  const level = name.includes("特別警報") ? 5
    : name.includes("危険警報") ? 4
    : name.includes("警報") ? 3
    : name.includes("注意報") ? 2 : 0;
  return PHENOMENON_CODES[phen][level] || null;
}

function xmlKids(el, name) {
  return el ? Array.from(el.children).filter(c => c.localName === name) : [];
}
function xmlKid(el, name) { return xmlKids(el, name)[0] || null; }
function xmlKidText(el, name) {
  const k = xmlKid(el, name);
  return k ? (k.textContent || "").trim() : "";
}
function toJstIso(ms) {
  return new Date(ms + 9 * 3600 * 1000).toISOString().replace(/\.\d{3}Z$/, "+09:00");
}

// Kind 1件を { code, status, touched } に解釈する
//   code    : JSONと同じ警報コード(解除・「発表警報・注意報はなし」は null)
//   touched : この Kind が関係する現象(解除で消えるものも含む)
function xmlResolveKind(kindEl) {
  const status = xmlKidText(kindEl, "Status");
  const name = xmlKidText(kindEl, "Name");
  const rawCode = xmlKidText(kindEl, "Code");
  const lastEl = xmlKid(kindEl, "LastKind");
  const lastName = xmlKidText(lastEl, "Name");
  const lastRawCode = xmlKidText(lastEl, "Code");
  const lifted = status === "解除" || status === "発表警報・注意報はなし" || name === "解除";

  const pick = (nm, raw) => {
    const byName = xmlNameToCode(nm);
    const byCode = raw && PHEN_OF_CODE[raw] ? raw : null;
    return byName || byCode || null;
  };

  const code = lifted ? null : pick(name, rawCode);
  const lastCode = pick(lastName, lastRawCode);
  const touched = new Set();
  for (const c of [code, lastCode]) {
    if (c && PHEN_OF_CODE[c]) touched.add(PHEN_OF_CODE[c]);
  }
  return { code, status, touched };
}

// 警報XML(VPWW55〜60)1通を解析して、市町村ごとの警報コードにする
// 戻り値 cities[市町村コード] = { kinds:[{code,status}], touched:Set<現象> }
//   touched = その市町村について電文が「状態を述べている」現象。
//   Kind から特定できない場合(LastKindなしの解除など)だけ、電文種別の既定の現象にする。
//   → 暴風(58)の解除電文が、載っていない暴風雪まで消してしまう問題を防ぐ。
function parseWarningXmlDoc(xmlText, url) {
  const m = url.match(XML_DOC_URL_RE);
  if (!m) return null;
  const typeNo = m[1];
  const office = m[2];

  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) return null;
  const root = doc.documentElement;

  if (xmlKidText(xmlKid(root, "Control"), "Status") !== "通常") return null; // 訓練・試験は無視
  const head = xmlKid(root, "Head");
  if (xmlKidText(head, "InfoType") === "取消") return null;
  const reportDateTime = xmlKidText(head, "ReportDateTime");
  const reportMs = Date.parse(reportDateTime);
  if (!Number.isFinite(reportMs)) return null;

  const body = xmlKid(root, "Body");
  let warnings = xmlKids(body, "Warning");
  if (warnings.length === 0 && body) warnings = Array.from(body.getElementsByTagNameNS("*", "Warning"));
  const warning = warnings.find(w => w.getAttribute("type") === XML_MUNICIPALITY_WARNING_TYPE);
  if (!warning) return null;

  const defaults = XML_DOC_COVERS[typeNo] || [];
  const cities = {};
  for (const item of xmlKids(warning, "Item")) {
    const areaEl = xmlKid(item, "Area") || item.getElementsByTagNameNS("*", "Area")[0] || null;
    const cityCode = areaEl ? (xmlKidText(areaEl, "Code") || (areaEl.getElementsByTagNameNS("*", "Code")[0]?.textContent || "").trim()) : "";
    if (!cityCode) continue;
    const c = cities[cityCode] || (cities[cityCode] = { kinds: [], touched: new Set() });
    let kindEls = xmlKids(item, "Kind");
    if (kindEls.length === 0) kindEls = Array.from(item.getElementsByTagNameNS("*", "Kind"));
    for (const kindEl of kindEls) {
      const r = xmlResolveKind(kindEl);
      r.touched.forEach(p => c.touched.add(p));
      if (r.code) c.kinds.push({ code: r.code, status: r.status });
    }
  }
  for (const c of Object.values(cities)) {
    if (c.touched.size === 0) defaults.forEach(p => c.touched.add(p));
  }
  return { typeNo, office, reportDateTime, reportMs, cities };
}

// オーバーレイ: 府県予報区コード → 現象 → 市町村コード → { reportMs, receivedAt, kinds }
// 電文時刻は「市町村 × 現象」ごとに持つ。
// → 古い電文が後着しても、より新しい電文が触れていない市町村の変化は取りこぼさない。
const xmlOverlay = {};

function phenCodeSet(phen) {
  return new Set(Object.values(PHENOMENON_CODES[phen] || {}));
}

function mergeXmlDocIntoOverlay(parsed) {
  let merged = false;
  const byPhen = xmlOverlay[parsed.office] || (xmlOverlay[parsed.office] = {});
  for (const [cityCode, c] of Object.entries(parsed.cities)) {
    for (const phen of c.touched) {
      const codes = phenCodeSet(phen);
      if (codes.size === 0) continue;
      const ents = byPhen[phen] || (byPhen[phen] = {});
      const cur = ents[cityCode];
      if (cur && cur.reportMs > parsed.reportMs) continue; // この市町村・現象には、より新しい電文が既にある
      ents[cityCode] = {
        reportMs: parsed.reportMs,
        receivedAt: Date.now(),
        kinds: c.kinds.filter(k => codes.has(k.code))
      };
      merged = true;
    }
  }
  return merged;
}

// JSON側の市町村項目が、ある現象について持っている有効なコード集合
function xmlActiveCodes(item, codes) {
  const s = new Set();
  for (const k of (item?.kinds || [])) {
    if (codes.has(k.code) && k.status !== "解除") s.add(k.code);
  }
  return s;
}

// fetchR8WarningData の結果(JSONレポートの配列)へオーバーレイを反映する
// JSONが追いついたかどうかは「市町村 × 現象」ごとに判定する。
//   ・JSONの発表時刻がXMLより新しい、または
//   ・JSONの内容がXMLの内容と一致している(同時刻の別電文を片方だけ反映済み、を区別できる)
// または同時刻でJSONがその現象を既に載せているときだけ、オーバーレイを破棄する。
function applyXmlOverlayToReports(reports) {
  const byOffice = new Map();
  for (const r of reports) {
    if (!r || !r.warning) continue;
    const key = String(r.regionCode);
    if (!byOffice.has(key)) byOffice.set(key, []);
    byOffice.get(key).push(r);
  }

  for (const [office, list] of byOffice) {
    const byPhen = xmlOverlay[office];
    if (!byPhen) continue;

    const jsonMs = Math.max(0, ...list.map(r => Date.parse(r.reportDatetime)).filter(Number.isFinite));
    const index = new Map();
    for (const r of list) {
      for (const it of (r.warning.class20Items || [])) index.set(it.areaCode, it);
    }
    let newestMs = 0;

    for (const [phen, ents] of Object.entries(byPhen)) {
      const codes = phenCodeSet(phen);
      for (const [cityCode, ent] of Object.entries(ents)) {
        let it = index.get(cityCode);
        const want = new Set(ent.kinds.map(k => k.code));
        const have = xmlActiveCodes(it, codes);
        const same = want.size === have.size && [...want].every(c => have.has(c));
        const expired = Date.now() - ent.receivedAt > XML_OVERLAY_TTL_MS;

        // JSONが追いついたか: 内容が一致 / JSONの方が新しい / 同時刻でJSONがその現象を既に載せている
        // (同時刻でJSONにその現象が無い場合は、別電文の反映待ちとみなしてXMLを使い続ける)
        const caught = same || jsonMs > ent.reportMs || (jsonMs === ent.reportMs && have.size > 0);
        if (caught || expired) {
          if (caught) console.info(`[XML高速化] JSON追従: ${office} ${phen} ${cityCode} (電文発表から約${Math.round((Date.now() - ent.reportMs) / 1000)}秒)`);
          delete ents[cityCode];
          continue;
        }

        if (!it) {
          if (ent.kinds.length === 0) continue;
          it = { areaCode: cityCode, kinds: [] };
          if (!list[0].warning.class20Items) list[0].warning.class20Items = [];
          list[0].warning.class20Items.push(it);
          index.set(cityCode, it);
        }
        it.kinds = (it.kinds || [])
          .filter(k => !codes.has(k.code))
          .concat(ent.kinds.map(k => ({ ...k })));
        newestMs = Math.max(newestMs, ent.reportMs);
      }
      if (Object.keys(ents).length === 0) delete byPhen[phen];
    }

    if (newestMs > 0) {
      // 表示に使う発表時刻も電文時刻に合わせる(形式はJSONと同じISO/+09:00)
      const iso = toJstIso(newestMs);
      for (const r of list) {
        if (!(Date.parse(r.reportDatetime) >= newestMs)) r.reportDatetime = iso;
      }
    }
    if (Object.keys(byPhen).length === 0) delete xmlOverlay[office];
  }
}

function xmlExtractDocUrls(feedText) {
  const doc = new DOMParser().parseFromString(feedText, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("フィードのXML解析に失敗しました");
  const urls = [];
  for (const entry of Array.from(doc.getElementsByTagNameNS("*", "entry"))) {
    const link = entry.getElementsByTagNameNS("*", "link")[0];
    let href = (link && link.getAttribute("href")) || "";
    if (!href) {
      const id = entry.getElementsByTagNameNS("*", "id")[0];
      href = id ? (id.textContent || "").trim() : "";
    }
    href = href.replace(/^http:\/\//i, "https://"); // 混在コンテンツ回避
    if (XML_DOC_URL_RE.test(href)) urls.push(href);
  }
  return urls;
}

async function xmlFetchText(url, isFeed) {
  // フィードは毎回サーバーへ再検証。電文は不変なので通常キャッシュ。
  const res = await fetch(url, { cache: isFeed ? "no-cache" : "default" });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return await res.text();
}

// 1回分のフィード確認。更新ボタンの連打などで重複実行しないよう、実行中は同じPromiseを共有する。
const xmlSeenUrls = new Set();
let xmlRefreshPromise = null;

function refreshXmlOverlay() {
  if (!xmlRefreshPromise) {
    xmlRefreshPromise = doRefreshXmlOverlay().finally(() => { xmlRefreshPromise = null; });
  }
  return xmlRefreshPromise;
}

async function doRefreshXmlOverlay() {
  const statusEl = document.getElementById("xmlStatus");
  try {
    const urls = xmlExtractDocUrls(await xmlFetchText(XML_FEED_URL, true));
    const base = u => u.slice(u.lastIndexOf("/") + 1);
    // ファイル名の先頭が発表時刻なので、古い順に適用する
    const fresh = urls.filter(u => !xmlSeenUrls.has(u))
      .sort((a, b) => base(a).localeCompare(base(b)));

    let merged = 0;
    for (let i = 0; i < fresh.length; i += XML_FETCH_PARALLEL) {
      const batch = fresh.slice(i, i + XML_FETCH_PARALLEL);
      const texts = await Promise.allSettled(batch.map(u => xmlFetchText(u, false)));
      batch.forEach((u, j) => {
        if (texts[j].status !== "fulfilled") return; // 失敗分は次回の更新で再試行
        xmlSeenUrls.add(u);
        try {
          const parsed = parseWarningXmlDoc(texts[j].value, u);
          if (parsed && mergeXmlDocIntoOverlay(parsed)) merged++;
        } catch (e) {
          console.warn("[XML] 電文解析失敗:", base(u), e);
        }
      });
    }
    statusEl.textContent = `XML: 対象電文${urls.length}件（新着${fresh.length}件を解析、${merged}件を反映）`;
  } catch (e) {
    console.warn("[XML] フィード取得に失敗しました:", e);
    statusEl.textContent = "XML: 取得できませんでした（JSONのみで表示）";
  }
}

async function fetchR8WarningData(regionCodes) {
  // JSONとXMLフィードを同時に取得し、XMLが新しい分だけ反映する
  const [results] = await Promise.all([
    Promise.all(regionCodes.map(async regionCode => {
      const url = `${WARNING_R8_BASE_URL}/${regionCode}.json`;
      try {
        const res = await fetch(url, {cache:"no-store"});
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        const reports = await res.json();
        return reports.map(report => ({...report, regionCode}));
      } catch(e) {
        console.warn(`警報JSON取得失敗: ${url}`, e);
        return [];
      }
    })),
    refreshXmlOverlay()
  ]);

  const reports = results.flat();
  applyXmlOverlayToReports(reports);
  return reports;
}

function getWarnColor(level) {
  switch (level) {
    case 2: return "🟨";
    case 3: return "🟥";
    case 4: return "🟪";
    case 5: return "⬛️";
    default: return "◆";
  }
}

// ================================================================
// 診断用(コンソールから xmlSelfTest() / xmlDebug() で実行)
// ================================================================
function xmlDebug() {
  const rows = [];
  for (const [o, byPhen] of Object.entries(xmlOverlay))
    for (const [p, ents] of Object.entries(byPhen))
      for (const [c, e] of Object.entries(ents))
        rows.push({ 府県予報区: o, 現象: p, 市町村: c, 電文時刻: toJstIso(e.reportMs), 内容: e.kinds.map(k => k.code).join(",") || "なし" });
  if (rows.length) console.table(rows);
  else console.log("[XML診断] 今、JSONより先行しているXMLはありません");
  return rows;
}

function xmlSelfTest() {
  const NAMES = { "02": "暴風雪警報", "03": "大雨警報", "05": "暴風警報", "09": "土砂災害警報", "10": "大雨注意報" };
  const T = m => `2026-01-01T00:${String(m).padStart(2, "0")}:00+09:00`;
  const K = (n, s = "発表", l = "") =>
    `<Kind><Status>${s}</Status><Name>${n}</Name>${l ? `<LastKind><Name>${l}</Name></LastKind>` : ""}</Kind>`;
  const doc = (no, min, items) => ({
    url: `x/20260101000000_0_VPWW${no}_999999.xml`,
    text: `<Report><Control><Status>通常</Status></Control><Head><InfoType>発表</InfoType><ReportDateTime>${T(min)}</ReportDateTime></Head><Body><Warning type="${XML_MUNICIPALITY_WARNING_TYPE}">` +
      Object.entries(items).map(([c, ks]) => `<Item><Area><Code>${c}</Code></Area>${ks.join("")}</Item>`).join("") +
      `</Warning></Body></Report>`
  });
  const J = (min, items) => ({ min, items: Object.entries(items).map(([c, cs]) => ({ areaCode: c, kinds: cs.map(code => ({ code, status: "発表" })) })) });

  const cases = [
    ["引き下げ", "警報→注意報", [doc("55", 10, { A: [K("大雨注意報")] })], J(5, { A: ["03"] }), { A: "大雨注意報" }],
    ["解除", "大雨警報の解除", [doc("55", 10, { A: [K("解除", "解除", "大雨警報")] })], J(5, { A: ["03"] }), { A: "なし" }],
    ["旧弱点", "同時刻の別電文(55/56)をJSONが片方だけ反映済み",
      [doc("55", 10, { A: [K("大雨警報")] }), doc("56", 10, { A: [K("土砂災害警報")] })], J(10, { A: ["03"] }), { A: "大雨警報+土砂災害警報" }],
    ["旧弱点", "暴風の解除電文に暴風雪が載らない(58)",
      [doc("58", 10, { A: [K("解除", "解除", "暴風警報")] })], J(5, { A: ["05", "02"] }), { A: "暴風雪警報" }],
    ["旧弱点", "古い電文が後着→他の市町村の変化を落とさない",
      [doc("55", 20, { B: [K("大雨警報")] }), doc("55", 10, { A: [K("大雨警報")] })], J(5, {}), { A: "大雨警報", B: "大雨警報" }],
    ["追従", "JSONが後の時刻ならJSONを使う",
      [doc("55", 10, { A: [K("大雨警報")] })], J(15, { A: ["10"] }), { A: "大雨注意報" }]
  ];

  const rows = []; let ok = 0, ng = 0;
  for (const [cat, name, docs, json, expect] of cases) {
    for (const k of Object.keys(xmlOverlay)) delete xmlOverlay[k];
    for (const d of docs) { const p = parseWarningXmlDoc(d.text, d.url); if (p) mergeXmlDocIntoOverlay(p); }
    const reports = [{ regionCode: "999999", reportDatetime: T(json.min), warning: { class20Items: json.items } }];
    applyXmlOverlayToReports(reports);
    const items = reports[0].warning.class20Items;
    const get = c => (items.find(i => i.areaCode === c)?.kinds || [])
      .filter(k => k.status !== "解除").map(k => k.code).sort().map(x => NAMES[x] || x).join("+") || "なし";
    const actual = {}; Object.keys(expect).forEach(c => actual[c] = get(c));
    const pass = JSON.stringify(actual) === JSON.stringify(expect);
    pass ? ok++ : ng++;
    rows.push({ 分類: cat, ケース: name, 結果: pass ? "✅ OK" : "❌ NG", 実際: JSON.stringify(actual), 期待: JSON.stringify(expect) });
  }
  for (const k of Object.keys(xmlOverlay)) delete xmlOverlay[k];
  console.table(rows);
  console.log(`OK ${ok} / NG ${ng}`);
  return { ok, ng };
}
// コンソールの実行コンテキストが親ページ(top)側でも呼べるように公開する
try { for (const w of [window.parent, window.top]) if (w && w !== window) { w.xmlSelfTest = xmlSelfTest; w.xmlDebug = xmlDebug; } } catch (e) {}
console.info("[XML診断] 準備完了: xmlSelfTest() で自己診断 / xmlDebug() で先行中のXML一覧");
